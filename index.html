<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPv4 地址查询</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #d9e7f3 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #ipResultsContainer {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            margin: 20px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 760px;
            box-sizing: border-box;
        }

        #ipResultsContainer h3 {
            text-align: center;
            width: 100%;
            margin: 5px 0 0;
            font-size: 1.25rem;
            color: #333;
        }

        .tips {
            width: 100%;
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 18px;
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
        }

        tr {
            transition: background-color 0.2s ease;
        }

        tr:hover {
            background-color: #f7fafc;
        }

        th,
        td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        tr:last-child td,
        tr:last-child th {
            border-bottom: none;
        }

        th {
            font-weight: 600;
            color: #444;
        }

        .ipregion {
            white-space: nowrap;
            font-weight: 800;
            font-size: 0.95rem;
            width: 12%;
        }

        .apiserver {
            white-space: nowrap;
            color: #888;
            font-size: 0.8rem;
            font-weight: 500;
            width: 16%;
        }

        .ip {
            white-space: nowrap;
            font-weight: 600;
            color: #222;
            font-size: 0.92rem;
            width: 22%;
        }

        .ipaddr {
            color: #1f2937;
            font-size: 0.82rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 240px;
        }

        .status {
            white-space: nowrap;
            font-size: 0.78rem;
            color: #666;
            width: 12%;
        }

        .status.loading {
            color: #2563eb;
        }

        .status.success {
            color: #059669;
        }

        .status.partial {
            color: #d97706;
        }

        .status.error {
            color: #dc2626;
        }

        @media (max-width: 640px) {
            #ipResultsContainer {
                margin: 10px;
                width: calc(100% - 20px);
                max-width: none;
                padding: 12px;
            }

            #ipResultsContainer h3 {
                margin-bottom: 8px;
                font-size: 1.15rem;
            }

            .tips {
                font-size: 0.78rem;
            }

            table {
                margin-top: 12px;
            }

            table,
            tbody {
                display: block;
                width: 100%;
            }

            tr {
                display: grid;
                grid-template-areas:
                    "region apiserver"
                    "ip status"
                    "addr addr";
                grid-template-columns: 1fr auto;
                background-color: #f9f9f9;
                margin-bottom: 10px;
                border-radius: 10px;
                overflow: hidden;
            }

            td,
            th {
                display: block;
                border: none;
                padding: 6px 8px;
            }

            .ipregion {
                grid-area: region;
                font-size: 0.78rem;
                display: flex;
                align-items: center;
            }

            .apiserver {
                grid-area: apiserver;
                text-align: right;
                font-size: 0.72rem;
                display: flex;
                align-items: center;
                justify-content: flex-end;
            }

            .ip {
                grid-area: ip;
                font-size: 0.88rem;
                text-align: left;
            }

            .status {
                grid-area: status;
                text-align: right;
                font-size: 0.74rem;
                display: flex;
                align-items: center;
                justify-content: flex-end;
            }

            .ipaddr {
                grid-area: addr;
                font-size: 0.76rem;
                max-width: none;
                text-align: left;
                color: #666;
                border-top: 1px solid #ececec;
            }
        }
    </style>
<title>公网IP查询 - 我的IP、本机IP、IPv4地址在线查询</title>
<meta name="description" content="免费在线查询当前公网IP、本机IP、IPv4地址、IP归属地和运营商信息，支持多个接口结果对比，快速查看我的IP、外网IP和当前网络出口地址。" />
<meta name="keywords" content="公网IP查询,我的IP,本机IP,IP地址查询,IPv4地址查询,外网IP查询,当前IP查询,IP归属地查询,IP所在地查询,运营商查询,ASN查询,ISP查询,网络出口IP" />
<meta name="robots" content="index,follow" />
<meta name="author" content="你的站点名称" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta charset="UTF-8" />
</head>
<body>
    <div id="ipResultsContainer">
<h3>公网IP / IPv4 地址查询</h3>
        <div class="tips"> 免费在线查询当前公网IP、本机IP、IPv4地址、IP归属地和运营商信息。
    支持多个接口结果对比，帮助你快速查看当前网络出口地址</div>
        <table>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const tableBody = document.querySelector("#ipResultsContainer table tbody");

        function joinSafe(...parts) {
            return parts
                .flat(Infinity)
                .filter(v => v !== undefined && v !== null && String(v).trim() !== "")
                .map(v => String(v).trim())
                .join(" ") || "";
        }

        function safeText(value, fallback = "未知") {
            if (value === undefined || value === null) return fallback;
            const text = String(value).trim();
            return text ? text : fallback;
        }

        function isValidIPv4(ip) {
            if (!ip || typeof ip !== "string") return false;
            const reg =
                /^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)$/;
            return reg.test(ip.trim());
        }

        async function fetchWithTimeout(url, options = {}, timeout = 6000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);

            try {
                const response = await fetch(url, {
                    ...options,
                    signal: controller.signal
                });
                clearTimeout(timer);
                return response;
            } catch (error) {
                clearTimeout(timer);
                throw error;
            }
        }

        const ipProviders = [
            {
                region: "国内",
                apiserver: "ipip.net",
                url: "https://myip.ipip.net/json",
                parse(data) {
                    const ip = data?.data?.ip ?? "";
                    const addr = Array.isArray(data?.data?.location)
                        ? joinSafe(data.data.location)
                        : "";
                    return { ip, addr };
                }
            },

            {
                region: "国外",
                apiserver: "ip.sb",
                url: "https://api.ip.sb/geoip",
                parse(data) {
                    const ip = data?.ip ?? "";
                    const addr = joinSafe(
                        data?.country,
                        data?.region,
                        data?.city,
                        data?.isp
                    );
                    return { ip, addr };
                }
            },

            {
                region: "国外",
                apiserver: "ipinfo.io",
                url: "https://ipinfo.io/json",
                parse(data) {
                    const ip = data?.ip ?? "";
                    const addr = joinSafe(
                        data?.country,
                        data?.region,
                        data?.city,
                        data?.org
                    );
                    return { ip, addr };
                }
            }
        ];

        function initializeTable() {
            tableBody.innerHTML = "";

            ipProviders.forEach(provider => {
                const row = document.createElement("tr");
                row.dataset.apiserver = provider.apiserver;

                const regionCell = document.createElement("th");
                regionCell.textContent = provider.region;
                regionCell.className = "ipregion";
                row.appendChild(regionCell);

                const apiServerCell = document.createElement("td");
                apiServerCell.textContent = provider.apiserver;
                apiServerCell.className = "apiserver";
                row.appendChild(apiServerCell);

                const ipCell = document.createElement("td");
                ipCell.textContent = "获取中...";
                ipCell.className = "ip";
                row.appendChild(ipCell);

                const statusCell = document.createElement("td");
                statusCell.textContent = "查询中";
                statusCell.className = "status loading";
                row.appendChild(statusCell);

                const addrCell = document.createElement("td");
                addrCell.textContent = "";
                addrCell.className = "ipaddr";
                row.appendChild(addrCell);

                tableBody.appendChild(row);
            });
        }

        function updateRow(providerName, { ip = "", addr = "", status = "", statusClass = "" }) {
            const row = tableBody.querySelector(`tr[data-apiserver="${providerName}"]`);
            if (!row) return;

            const ipCell = row.querySelector(".ip");
            const addrCell = row.querySelector(".ipaddr");
            const statusCell = row.querySelector(".status");

            ipCell.textContent = safeText(ip, "未知");
            addrCell.textContent = safeText(addr, "信息不完整");
            statusCell.textContent = status;
            statusCell.className = `status ${statusClass}`.trim();
        }

        async function fetchIP(provider) {
            updateRow(provider.apiserver, {
                ip: "获取中...",
                addr: "",
                status: "查询中",
                statusClass: "loading"
            });

            try {
                const response = await fetchWithTimeout(
                    provider.url,
                    {
                        method: "GET",
                        headers: {
                            Accept: "application/json"
                        },
                        cache: "no-store"
                    },
                    6000
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                const parsed = provider.parse(data);

                const ip = safeText(parsed.ip, "未知");
                const addr = parsed.addr ? safeText(parsed.addr, "信息不完整") : "信息不完整";

                let status = "成功";
                let statusClass = "success";

                if (ip === "未知" || addr === "信息不完整") {
                    status = "部分成功";
                    statusClass = "partial";
                }

                if (ip !== "未知" && !isValidIPv4(ip)) {
                    status = "返回非 IPv4";
                    statusClass = "partial";
                }

                updateRow(provider.apiserver, {
                    ip,
                    addr,
                    status,
                    statusClass
                });
            } catch (error) {
                console.error(`Error fetching from ${provider.apiserver}:`, error);
                updateRow(provider.apiserver, {
                    ip: "查询失败",
                    addr: "查询失败",
                    status: error.name === "AbortError" ? "请求超时" : "请求失败",
                    statusClass: "error"
                });
            }
        }

        async function loadAllIPs() {
            initializeTable();
            await Promise.allSettled(ipProviders.map(provider => fetchIP(provider)));
        }

        loadAllIPs();
    </script>
</body>

</script>
</html>
